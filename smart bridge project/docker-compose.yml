version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./food_verse.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AI_MODEL_NAME=gemini-1.5-flash
    volumes:
      - ./uploads:/app/uploads
      - ./food_verse.db:/app/food_verse.db

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

